name: Build

# 成果物（コンテナイメージ）の生成だけを担う。品質ゲートは ci.yml の担当。
# 混ぜると PR のたびに GHCR にイメージが溜まる。
#
# ci.yml の成否は待たない。デプロイが手動なので、CI が赤いコミットは
# 人間が選ばない限り本番に出ない。
on:
  push:
    branches: [ main ]

permissions:
  contents: read
  packages: write

jobs:
  build:
    # public リポジトリでは arm64 ランナーが無料。ネイティブビルドなので QEMU は要らない。
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Log in to GHCR
        # GITHUB_TOKEN で足りる（packages: write を付与済み）。PAT は不要。
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        # latest は付けない。「今どれが動いているか」が曖昧になるため、
        # デプロイは必ずタグを明示して行う。
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY}"
          tag="sha-$(git rev-parse --short=7 HEAD)"
          docker build -t "${image}:${tag}" .
          docker push "${image}:${tag}"
          echo "pushed ${image}:${tag}" >> "$GITHUB_STEP_SUMMARY"
