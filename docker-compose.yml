services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "8080:8080"
    volumes:
      - .:/rails
      - bundle:/usr/local/bundle
    env_file:
      - .env.local
    environment:
      - PORT=8080
    depends_on:
      - db
    stdin_open: true
    tty: true

  db:
    image: postgres:16
    env_file:
      - .env.local
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  postgres_data:
  bundle:
