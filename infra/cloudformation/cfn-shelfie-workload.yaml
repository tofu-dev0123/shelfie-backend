AWSTemplateFormatVersion: "2010-09-09"

# Shelfie の本番ワークロード一式。
#
# EC2 に永続データを置かない（DB は Neon / オブジェクトストレージ未使用）ため、
# このスタックは削除して作り直せる。消えては困るもの（予算アラート）は
# cfn-shelfie-budget.yaml に分けている。
#
# 命名規則と適用手順は infra/README.md を参照。
#
# 前提: /shelfie/production/host/CLOUDFLARE_TUNNEL_TOKEN が SecureString として
#       投入済みであること。user-data がこれを読むため、無いと初期化に失敗する。
Description: Shelfie production workload - VPC, IAM, and a single EC2 instance reached only through Cloudflare Tunnel

Parameters:
  AmiId:
    Type: AWS::EC2::Image::Id
    Description: >-
      Ubuntu 24.04 arm64 AMI in this region. Resolve it with the SSM public parameter
      /aws/service/canonical/ubuntu/server/24.04/stable/current/arm64/hvm/ebs-gp3/ami-id
      and pass the resulting id explicitly.

  GitHubRepository:
    Type: String
    Description: GitHub repository allowed to assume the deploy and migrate roles.
    Default: tofu-dev0123/shelfie-backend

  ApiBaseUrl:
    Type: String
    Description: Public base URL of this API. Used to build OAuth redirect URIs.
    Default: https://api.shelfie.jp

  FrontendUrl:
    Type: String
    Description: Frontend base URL that OAuth flows redirect back to.
    Default: https://shelfie.jp

  CookieDomain:
    Type: String
    Description: Parent domain shared by the frontend and this API. Must start with a dot.
    Default: .shelfie.jp
    AllowedPattern: "^\\..+"
    ConstraintDescription: Must start with a dot, for example .shelfie.jp

  CorsAllowedOrigins:
    Type: String
    Description: Comma separated list of allowed CORS origins.
    Default: https://shelfie.jp

  RakutenOrigin:
    Type: String
    Description: Origin and Referer header sent to the Rakuten Books API.
    Default: https://api.shelfie.jp

  GoogleOauthClientId:
    Type: String
    Description: Google OAuth client id. Not a secret - it appears in the authorization URL.

  GithubOauthClientId:
    Type: String
    Description: GitHub OAuth client id. Not a secret - it appears in the authorization URL.

Resources:
  # ---------------------------------------------------------------------------
  # ネットワーク
  #
  # ALB を使わないため複数 AZ は不要。private サブネットも作らない
  # （NAT Gateway が月 $40 前後かかり、ADR 010 の予算 $13.45 が壊れる）。
  # ingress を1つも開けないので、public サブネットでも外から到達できない。
  # ---------------------------------------------------------------------------
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - { Key: Name, Value: shelfie-vpc }
        - { Key: Project, Value: shelfie }

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - { Key: Name, Value: shelfie-igw }
        - { Key: Project, Value: shelfie }

  InternetGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.0.0.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      # cloudflared / SSM / GHCR / Neon への外向き通信に IPv4 が要る。
      # Tunnel なので固定は不要（EIP と料金は同じ）。
      MapPublicIpOnLaunch: true
      Tags:
        - { Key: Name, Value: shelfie-public-subnet }
        - { Key: Project, Value: shelfie }

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - { Key: Name, Value: shelfie-public-rt }
        - { Key: Project, Value: shelfie }

  DefaultPublicRoute:
    Type: AWS::EC2::Route
    DependsOn: InternetGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet
      RouteTableId: !Ref PublicRouteTable

  # ---------------------------------------------------------------------------
  # Security Group
  #
  # ★ ingress は0件。これがこの構成の要。
  #
  # cloudflared が EC2 側から外向きに接続を張り、その接続の上をリクエストが流れる。
  # ファイアウォールが見るのは「どちらが接続を張ったか」なので、
  # 外から接続を受け付けるポートは1つも要らない。
  #
  # ★ SecurityGroupEgress を1つでも書くと、CFN は既定の全許可を置き換える。
  #   7844 を落とすと Tunnel が張れず全断するので、消さないこと。
  # ---------------------------------------------------------------------------
  InstanceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: No inbound access. Outbound limited to what the tunnel and the app need.
      VpcId: !Ref Vpc
      SecurityGroupIngress: []
      SecurityGroupEgress:
        - Description: SSM / Parameter Store / GHCR / AWS APIs
          IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
        - Description: cloudflared over QUIC
          IpProtocol: udp
          FromPort: 7844
          ToPort: 7844
          CidrIp: 0.0.0.0/0
        - Description: cloudflared HTTP/2 fallback
          IpProtocol: tcp
          FromPort: 7844
          ToPort: 7844
          CidrIp: 0.0.0.0/0
        - Description: Neon PostgreSQL
          IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          CidrIp: 0.0.0.0/0
        - Description: apt and the cloudflared deb download
          IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - Description: DNS over UDP
          IpProtocol: udp
          FromPort: 53
          ToPort: 53
          CidrIp: 0.0.0.0/0
        - Description: DNS over TCP
          IpProtocol: tcp
          FromPort: 53
          ToPort: 53
          CidrIp: 0.0.0.0/0
      Tags:
        - { Key: Name, Value: shelfie-sg }
        - { Key: Project, Value: shelfie }

  # ---------------------------------------------------------------------------
  # GitHub OIDC provider
  #
  # 専用アカウントなので自前で作れる（共用アカウントだと既存と衝突して作れない）。
  # aud の検証は ClientIdList で行われる。
  # ---------------------------------------------------------------------------
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      # AWS は主要 IdP のサムプリントを実質検証しないため、プレースホルダで運用する。
      ThumbprintList:
        - "1234567890123456789012345678901234567890"
      Tags:
        - { Key: Project, Value: shelfie }

  # ---------------------------------------------------------------------------
  # EC2 インスタンスロール
  #
  # 秘密を読むのはこのロールだけ。GitHub Actions 側のロールは秘密を読めない。
  # ---------------------------------------------------------------------------
  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: shelfie-ec2
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        # SSM Session Manager と Run Command に必要
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: read-shelfie-parameters
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters
                  - ssm:GetParametersByPath
                Resource:
                  # GetParametersByPath はパス自体への権限も要る
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/shelfie/production
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/shelfie/production/*
              - Effect: Allow
                Action: kms:Decrypt
                # AWS 管理キー alias/aws/ssm の ARN はテンプレート時点で分からないため、
                # SSM 経由の復号に限定する条件で絞る。
                Resource: "*"
                Condition:
                  StringEquals:
                    kms:ViaService: !Sub ssm.${AWS::Region}.amazonaws.com
      Tags:
        - { Key: Project, Value: shelfie }

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref InstanceRole]

  # ---------------------------------------------------------------------------
  # GitHub Actions（デプロイ用）
  #
  # ★ 秘密を1つも読めない。読むのは EC2 のインスタンスロール。
  # ★ sub を environment で絞ることで、GitHub Environment の承認が
  #   IAM レベルの前提条件になる（ワークフローを書き換えても迂回できない）。
  # ---------------------------------------------------------------------------
  GhaDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: shelfie-gha-deploy
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Federated: !Ref GitHubOidcProvider }
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              # StringLike は使わない。ワイルドカードを許すと
              # 任意のブランチ・PR から assume できてしまう。
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub repo:${GitHubRepository}:environment:production-deploy
      Policies:
        - PolicyName: send-deploy-command
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ssm:SendCommand
                # AWS 所有のドキュメントなのでアカウント ID の位置が空になる
                Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}::document/AWS-RunShellScript
              - Effect: Allow
                Action: ssm:SendCommand
                Resource: !Sub arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/*
                Condition:
                  StringEquals:
                    ssm:resourceTag/Project: shelfie
              - Effect: Allow
                Action:
                  - ssm:GetCommandInvocation
                  - ssm:ListCommandInvocations
                Resource: "*"
      Tags:
        - { Key: Project, Value: shelfie }

  # ---------------------------------------------------------------------------
  # GitHub Actions（マイグレーション用）
  #
  # Neon は公開エンドポイントなのでランナーから直接繋ぐ。EC2 を経由しない。
  # rails db:prepare の起動に必要な秘密は DATABASE_URL と SECRET_KEY_BASE の
  # 2つだけであることを実測で確認しているため、ARN を個別に列挙する。
  # ---------------------------------------------------------------------------
  GhaMigrateRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: shelfie-gha-migrate
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Federated: !Ref GitHubOidcProvider }
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub repo:${GitHubRepository}:environment:production-migrate
      Policies:
        - PolicyName: read-migration-parameters
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters
                Resource:
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/shelfie/production/app/DATABASE_URL
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/shelfie/production/app/SECRET_KEY_BASE
              - Effect: Allow
                Action: kms:Decrypt
                Resource: "*"
                Condition:
                  StringEquals:
                    kms:ViaService: !Sub ssm.${AWS::Region}.amazonaws.com
      Tags:
        - { Key: Project, Value: shelfie }

  # ---------------------------------------------------------------------------
  # EC2
  # ---------------------------------------------------------------------------
  Instance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref AmiId
      # ADR 010: Graviton（arm64）。x86 に落とすと t3.micro で月 $2.05 高くなる。
      InstanceType: t4g.micro
      IamInstanceProfile: !Ref InstanceProfile
      SubnetId: !Ref PublicSubnet
      SecurityGroupIds: [!Ref InstanceSecurityGroup]
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeType: gp3
            VolumeSize: 20
            # app.env が平文でディスク上に存在するため暗号化する。追加費用なし。
            Encrypted: true
            DeleteOnTermination: true
      MetadataOptions:
        # ★ 必須。IMDSv1 が有効だと、アプリに SSRF が1つあるだけで
        #   インスタンスロールの一時クレデンシャルが盗まれ、
        #   Parameter Store の全秘密に到達される。
        #   本アプリは楽天 API への外部リクエストを持つ。
        HttpTokens: required
        HttpPutResponseHopLimit: 1
        HttpEndpoint: enabled
      Tags:
        - { Key: Name, Value: shelfie-prod }
        # ★ このタグが無いと deploy ロールから SendCommand できない
        - { Key: Project, Value: shelfie }
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euxo pipefail

          # ADR 010 のメモリ懸念への対処。
          # Kamal を外して新旧2コンテナが並ばなくなったが、保険として張っておく。
          fallocate -l 2G /swapfile
          chmod 600 /swapfile
          mkswap /swapfile
          swapon /swapfile
          echo '/swapfile none swap sw 0 0' >> /etc/fstab

          # cloud-init と unattended-upgrades が apt のロックを持っていることがある
          export DEBIAN_FRONTEND=noninteractive
          for i in $(seq 1 30); do
            if apt-get update -qq; then break; fi
            sleep 10
          done
          apt-get install -y -qq docker.io unzip
          systemctl enable --now docker

          # AWS CLI v2（Ubuntu には入っていない / Graviton なので aarch64）
          curl -fsSL https://awscli.amazonaws.com/awscli-exe-linux-aarch64.zip -o /tmp/awscli.zip
          unzip -q /tmp/awscli.zip -d /tmp
          /tmp/aws/install
          rm -rf /tmp/awscli.zip /tmp/aws

          curl -fsSL -o /tmp/cloudflared.deb \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-arm64.deb
          dpkg -i /tmp/cloudflared.deb || apt-get install -y -qq -f
          rm -f /tmp/cloudflared.deb

          # ★ トークンを user-data に直書きしない。
          #   user-data は describe-instance-attribute で読めるうえ、
          #   インスタンス内から認証なしでメタデータ経由で取得できる。
          # ★ set +x でトレースを止める。-x のままだとトークンが
          #   /var/log/cloud-init-output.log に平文で残る。
          set +x
          TUNNEL_TOKEN="$(aws ssm get-parameter \
            --name /shelfie/production/host/CLOUDFLARE_TUNNEL_TOKEN \
            --with-decryption --query Parameter.Value --output text \
            --region ${AWS::Region})"
          cloudflared service install "${!TUNNEL_TOKEN}"
          unset TUNNEL_TOKEN
          set -x

          systemctl enable cloudflared

          mkdir -p /opt/shelfie
          chmod 700 /opt/shelfie

          # ★ CFN は user-data の失敗を検知しない（死んでも CREATE_COMPLETE になる）。
          #   デプロイスクリプトが冒頭でこのファイルの存在を確認することで、
          #   初期化の失敗が「デプロイが赤くなる」形で顕在化する。
          touch /opt/shelfie/.initialized

  # ---------------------------------------------------------------------------
  # SSM パラメータ（String のみ）
  #
  # SecureString は CloudFormation で作成できないため、秘密は手作業で投入する。
  # このテンプレートは git で管理されるので、秘密が書けない方が安全である。
  # ---------------------------------------------------------------------------
  ApiBaseUrlParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /shelfie/production/app/API_BASE_URL
      Type: String
      Value: !Ref ApiBaseUrl

  FrontendUrlParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /shelfie/production/app/FRONTEND_URL
      Type: String
      Value: !Ref FrontendUrl

  # 空やホスト名だけだとホストオンリー Cookie になり、
  # API 通信は動くまま Next.js 側の判定だけが静かに死ぬ（ADR 010 の既知の罠）。
  CookieDomainParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /shelfie/production/app/COOKIE_DOMAIN
      Type: String
      Value: !Ref CookieDomain

  CorsAllowedOriginsParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /shelfie/production/app/CORS_ALLOWED_ORIGINS
      Type: String
      Value: !Ref CorsAllowedOrigins

  RakutenOriginParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /shelfie/production/app/RAKUTEN_ORIGIN
      Type: String
      Value: !Ref RakutenOrigin

  GoogleOauthClientIdParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /shelfie/production/app/GOOGLE_OAUTH_CLIENT_ID
      Type: String
      Value: !Ref GoogleOauthClientId

  GithubOauthClientIdParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /shelfie/production/app/GITHUB_OAUTH_CLIENT_ID
      Type: String
      Value: !Ref GithubOauthClientId

Outputs:
  InstanceId:
    Description: EC2 instance id. Register it as the EC2_INSTANCE_ID GitHub variable.
    Value: !Ref Instance
    Export:
      Name: !Sub "${AWS::StackName}-InstanceId"

  DeployRoleArn:
    Description: Role assumed by the deploy workflow. Register it as AWS_DEPLOY_ROLE_ARN.
    Value: !GetAtt GhaDeployRole.Arn
    Export:
      Name: !Sub "${AWS::StackName}-DeployRoleArn"

  MigrateRoleArn:
    Description: Role assumed by the migrate workflow. Register it as AWS_MIGRATE_ROLE_ARN.
    Value: !GetAtt GhaMigrateRole.Arn
    Export:
      Name: !Sub "${AWS::StackName}-MigrateRoleArn"
