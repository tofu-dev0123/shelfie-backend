---
openapi: 3.0.1
info:
  title: Shelfie API V1
  version: v1
  description: Shelfie バックエンド API ドキュメント
servers:
- url: http://localhost:8080
  description: 開発環境
components:
  securitySchemes:
    Bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Clerk JWT トークン
  schemas: {}
paths:
  "/v1/auth/login":
    post:
      summary: ログインAPI
      tags:
      - 認証系
      security:
      - Bearer: []
      responses:
        '200':
          description: ログイン成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                    example: eyJ...
                required:
                - access_token
        '401':
          description: Clerk JWT が無効
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        example: UNAUTHORIZED
                      message:
                        type: string
        '404':
          description: ユーザーが存在しない
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        example: NOT_FOUND
                      message:
                        type: string
  "/v1/auth/logout":
    delete:
      summary: ログアウトAPI
      tags:
      - 認証系
      responses:
        '200':
          description: すでにログアウト済み（DBにレコードなし）
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: すでにログアウト済みです。
                required:
                - message
  "/v1/auth/refresh":
    post:
      summary: アクセストークン再発行API
      tags:
      - 認証系
      responses:
        '200':
          description: 再発行成功（リフレッシュトークンのローテーションあり）
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                    example: eyJ...
                required:
                - access_token
        '401':
          description: リフレッシュトークンが期限切れ
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        example: UNAUTHORIZED
                      message:
                        type: string
  "/v1/books/search":
    get:
      summary: 書籍検索API
      tags:
      - 書籍系
      security:
      - Bearer: []
      parameters:
      - name: q
        in: query
        required: true
        description: 検索キーワード（空白トリム後1文字以上・100文字以内）
        schema:
          type: string
      - name: cursor
        in: query
        required: false
        description: 前回レスポンスの next_cursor（省略時は先頭から）
        schema:
          type: string
      responses:
        '200':
          description: 検索結果 0件
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        isbn:
                          type: string
                          example: '9784873118079'
                        title:
                          type: string
                          example: リーダブルコード
                        authors:
                          type: array
                          items:
                            type: string
                          example:
                          - Dustin Boswell
                        thumbnail_url:
                          type: string
                          nullable: true
                          example: https://...
                        is_in_my_want_to_read:
                          type: boolean
                          nullable: true
                          example: true
                          description: ログイン中ユーザーが読みたいリストに登録しているか。検索は認証必須のため未ログイン (null)
                            は通常発生しない
                      required:
                      - is_in_my_want_to_read
                    example: []
                  pagination:
                    type: object
                    properties:
                      next_cursor:
                        type: string
                        nullable: true
                        example:
                      has_next:
                        type: boolean
                        example: false
                    required:
                    - next_cursor
                    - has_next
                required:
                - items
                - pagination
        '401':
          description: アクセストークンが無効
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        example: UNAUTHORIZED
                      message:
                        type: string
                    required:
                    - code
                    - message
        '422':
          description: cursor のデコード失敗
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        example: VALIDATION_ERROR
                      message:
                        type: string
                    required:
                    - code
                    - message
        '503':
          description: 楽天 Books API エラー
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        example: EXTERNAL_API_ERROR
                      message:
                        type: string
                    required:
                    - code
                    - message
  "/v1/books/{isbn}/users":
    get:
      summary: 既読書籍ユーザー一覧取得API
      tags:
      - 書籍系
      parameters:
      - name: isbn
        in: path
        required: true
        description: 書籍の ISBN-13
        schema:
          type: string
      - name: cursor
        in: query
        required: false
        description: 前回レスポンスの next_cursor（省略時は先頭から）
        schema:
          type: string
      - name: limit
        in: query
        required: false
        description: 最大取得件数。上限は50で、超えた場合は50にクランプされる（デフォルト20）
        schema:
          type: integer
      responses:
        '200':
          description: limit が50超のときクランプされる
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        username:
                          type: string
                          example: komusan
                        nickname:
                          type: string
                          example: コムさん
                        avatar_url:
                          type: string
                          nullable: true
                          example:
                      required:
                      - username
                      - nickname
                      - avatar_url
                    example: []
                  pagination:
                    type: object
                    properties:
                      next_cursor:
                        type: string
                        nullable: true
                        example:
                      has_next:
                        type: boolean
                        example: false
                    required:
                    - next_cursor
                    - has_next
                required:
                - items
                - pagination
  "/v1/books/{isbn}":
    get:
      summary: 書籍取得API
      tags:
      - 書籍系
      security:
      - Bearer: []
      parameters:
      - name: isbn
        in: path
        required: true
        description: 書籍の ISBN-13（13桁の数字）
        schema:
          type: string
      responses:
        '200':
          description: 読みたいリストに登録済みなら is_in_my_want_to_read=true
          content:
            application/json:
              schema:
                type: object
                properties:
                  isbn:
                    type: string
                    example: '9784873118079'
                  title:
                    type: string
                    example: リーダブルコード
                  authors:
                    type: array
                    items:
                      type: string
                    example:
                    - Dustin Boswell
                    - Trevor Foucher
                  thumbnail_url:
                    type: string
                    nullable: true
                    example: https://example.com/thumbnail.jpg
                  is_in_my_want_to_read:
                    type: boolean
                    nullable: true
                    example: true
                    description: ログイン中ユーザーが読みたいリストに登録しているか。未ログイン時は null
                required:
                - is_in_my_want_to_read
        '401':
          description: アクセストークンが無効
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        example: UNAUTHORIZED
                      message:
                        type: string
                    required:
                    - code
                    - message
        '404':
          description: isbn の形式が不正（ルートにマッチしない）
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        example: NOT_FOUND
                      message:
                        type: string
                    required:
                    - code
                    - message
        '503':
          description: 楽天 Books API エラー
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        example: EXTERNAL_API_ERROR
                      message:
                        type: string
                    required:
                    - code
                    - message
  "/v1/feed":
    get:
      summary: フィード取得API
      tags:
      - フィード系
      parameters:
      - name: Authorization
        in: header
        required: false
        description: アクセストークン。任意。省略時は全ユーザーの投稿を返す
        schema:
          type: string
      - name: cursor
        in: query
        required: false
        description: 前回レスポンスの next_cursor。不正な値の場合は 422 を返す
        schema:
          type: string
      - name: limit
        in: query
        required: false
        description: 最大取得件数（デフォルト20・上限50）。0以下はデフォルト値、上限超はクランプ
        schema:
          type: integer
      responses:
        '200':
          description: 投稿が存在しない
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          example: 1
                        content:
                          type: string
                          nullable: true
                          example: とても良い本でした
                        tags:
                          type: array
                          items:
                            type: string
                          example:
                          - Architecture
                          - Go
                        created_at:
                          type: string
                          example: '2026-03-05T00:00:00Z'
                        book:
                          type: object
                          properties:
                            isbn:
                              type: string
                              example: '9784873116068'
                            title:
                              type: string
                              example: リーダブルコード
                            authors:
                              type: array
                              items:
                                type: string
                              example:
                              - Dustin Boswell
                            thumbnail_url:
                              type: string
                              nullable: true
                              example:
                            is_in_my_want_to_read:
                              type: boolean
                              nullable: true
                              example:
                              description: ログイン中ユーザーが読みたいリストに登録しているか。未ログイン時は null
                          required:
                          - isbn
                          - title
                          - authors
                          - thumbnail_url
                          - is_in_my_want_to_read
                        user:
                          type: object
                          properties:
                            username:
                              type: string
                              example: komusan
                            nickname:
                              type: string
                              example: コムさん
                            avatar_url:
                              type: string
                              nullable: true
                              example:
                          required:
                          - username
                          - nickname
                          - avatar_url
                      required:
                      - id
                      - content
                      - tags
                      - created_at
                      - book
                      - user
                  pagination:
                    type: object
                    properties:
                      next_cursor:
                        type: string
                        nullable: true
                        example:
                      has_next:
                        type: boolean
                        example: false
                    required:
                    - next_cursor
                    - has_next
                required:
                - items
                - pagination
        '401':
          description: アクセストークンが無効・期限切れ
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                    required:
                    - code
                    - message
        '422':
          description: 不正なカーソル値
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                    required:
                    - code
                    - message
  "/v1/me/avatar":
    post:
      summary: アバター画像アップロードAPI
      tags:
      - マイページ系
      security:
      - Bearer: []
      parameters: []
      responses:
        '200':
          description: アップロード成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  avatar_url:
                    type: string
                    nullable: true
                    example: https://example.cloudfront.net/avatars/1.jpg
                required:
                - avatar_url
        '400':
          description: avatar フィールドが未添付
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        example: BAD_REQUEST
                      message:
                        type: string
        '401':
          description: アクセストークンなし
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        example: UNAUTHORIZED
                      message:
                        type: string
        '422':
          description: ファイルサイズが 5MB 超
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        example: UNPROCESSABLE_ENTITY
                      message:
                        type: string
        '500':
          description: S3 アップロード失敗
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        example: INTERNAL_SERVER_ERROR
                      message:
                        type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: file
        required: true
        description: アップロードする画像ファイル（JPEG / PNG / WebP、最大 5MB）
    delete:
      summary: アバター画像削除API
      tags:
      - マイページ系
      security:
      - Bearer: []
      responses:
        '200':
          description: 削除成功（アバターなし・冪等）
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 削除が完了しました
                required:
                - message
        '401':
          description: アクセストークンなし
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        example: UNAUTHORIZED
                      message:
                        type: string
        '500':
          description: S3 削除失敗
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        example: INTERNAL_SERVER_ERROR
                      message:
                        type: string
  "/v1/me/books":
    post:
      summary: 本棚追加API
      tags:
      - 本棚系
      security:
      - Bearer: []
      parameters: []
      responses:
        '201':
          description: 本文中のハッシュタグから Tag を動的に生成する
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 登録が完了しました
                required:
                - message
        '401':
          description: アクセストークンなし
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        example: UNAUTHORIZED
                      message:
                        type: string
        '404':
          description: 楽天書籍APIに書籍が存在しない
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        example: NOT_FOUND
                      message:
                        type: string
        '409':
          description: すでに同じ書籍を登録済み
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        example: CONFLICT
                      message:
                        type: string
        '422':
          description: purchase_links の URL 形式が不正
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        example: VALIDATION_ERROR
                      message:
                        type: string
                      field:
                        type: string
                        example: purchase_links
        '503':
          description: 楽天書籍APIがエラーを返した
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        example: EXTERNAL_API_ERROR
                      message:
                        type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                isbn:
                  type: string
                  example: '9784873116068'
                content:
                  type: string
                  example: 'とても良い本でした #Go #アーキテクチャ'
                purchase_links:
                  type: array
                  items:
                    type: string
                  example:
                  - https://www.amazon.co.jp/...
              required:
              - isbn
        required: true
  "/v1/me/books/{isbn}":
    put:
      summary: 本棚投稿更新API
      tags:
      - 本棚系
      security:
      - Bearer: []
      parameters:
      - name: isbn
        in: path
        required: true
        description: 書籍の ISBN-13
        schema:
          type: string
      responses:
        '200':
          description: ハッシュタグが本文から消えると tag も外れる
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 更新が完了しました
                required:
                - message
        '401':
          description: アクセストークンなし
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        example: UNAUTHORIZED
                      message:
                        type: string
        '404':
          description: 書籍または投稿が存在しない
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        example: NOT_FOUND
                      message:
                        type: string
        '422':
          description: purchase_links の URL 形式が不正
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        example: VALIDATION_ERROR
                      message:
                        type: string
                      field:
                        type: string
                        example: purchase_links
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                content:
                  type: string
                  example: '改めて読み直したら更に良かったです #Go #アーキテクチャ'
                purchase_links:
                  type: array
                  items:
                    type: string
                  example:
                  - https://www.amazon.co.jp/...
              required:
              - content
              - purchase_links
        required: true
    delete:
      summary: 本棚投稿削除API
      tags:
      - 本棚系
      security:
      - Bearer: []
      parameters:
      - name: isbn
        in: path
        required: true
        description: 書籍の ISBN-13
        schema:
          type: string
      responses:
        '200':
          description: 冪等性：book 自体が存在しない isbn
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 削除が完了しました
                required:
                - message
        '401':
          description: アクセストークンなし
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        example: UNAUTHORIZED
                      message:
                        type: string
        '422':
          description: isbn が13桁の数字でない
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        example: VALIDATION_ERROR
                      message:
                        type: string
  "/v1/me/follows/{username}":
    post:
      summary: フォローAPI
      tags:
      - フォロー系
      security:
      - Bearer: []
      parameters:
      - name: username
        in: path
        required: true
        description: フォローするユーザーの username
        schema:
          type: string
      responses:
        '201':
          description: フォロー成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: フォローしました
                required:
                - message
        '401':
          description: アクセストークンなし
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        example: UNAUTHORIZED
                      message:
                        type: string
        '404':
          description: ユーザーが存在しない
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        example: NOT_FOUND
                      message:
                        type: string
        '409':
          description: 既にフォロー済み
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        example: CONFLICT
                      message:
                        type: string
        '422':
          description: 自分自身をフォローしようとした
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        example: VALIDATION_ERROR
                      message:
                        type: string
    delete:
      summary: フォロー解除API
      tags:
      - フォロー系
      security:
      - Bearer: []
      parameters:
      - name: username
        in: path
        required: true
        description: フォロー解除するユーザーの username
        schema:
          type: string
      responses:
        '200':
          description: フォロー解除成功（ユーザーが存在しない場合も200）
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: フォローを解除しました
                required:
                - message
        '401':
          description: アクセストークンが無効・期限切れ
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        example: UNAUTHORIZED
                      message:
                        type: string
        '422':
